    source p.rootProject.file('tests/TorsoAttachmentCheck.java')
    if (p.path == ':neoforge:26.2') source p.rootProject.file('tests/EarlyNotificationLoadCheck.java')
    classpath = p.sourceSets.main.runtimeClasspath
    destinationDirectory = output
    options.release = 25
   }
   p.tasks.register('checkPublicChat', JavaExec) {
    dependsOn compile
    classpath = p.sourceSets.main.runtimeClasspath + files(output)
    mainClass = 'PublicChatCheck'
   }
   p.tasks.register('checkChatMotion', JavaExec) {
