    source = files(p.rootProject.file('tests/CosmeticUvCheck.java'))
    source p.rootProject.file('tests/CosmeticGeometryCheck.java')
    source p.rootProject.file('tests/MusicAccountsCheck.java')
    source p.rootProject.file('tests/SpotifyWebCheck.java')
    source p.rootProject.file('tests/ToastStackCheck.java')
    source p.rootProject.file('tests/ChatReactionsCheck.java')
    source p.rootProject.file('tests/MenuArmPoseCheck.java')
    source p.rootProject.file('tests/FriendListLayoutCheck.java')
